<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单 · 关系复原胶</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #140b18; color: #f3e9e2; font: 15px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 22px 18px 6px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
  .sub { color: #a9959f; font-size: 12.5px; margin: 6px 0 0; }
  #list { padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 0 auto; }
  .order { border: 1px solid #3a2740; background: #1d1222; border-radius: 14px; padding: 13px 14px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .row b { font-size: 15px; }
  .price { color: #ffb37a; font-weight: 700; font-size: 17px; }
  .meta { color: #8f7d88; font-size: 11.5px; margin-top: 3px; word-break: break-all; }
  .st { display: inline-block; margin-top: 8px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #2a1c30; color: #d9c6d2; }
  .order.review .st { background: #3a2a12; color: #ffcf8a; }
  .order.paid .st { background: #16351f; color: #8ee0a6; }
  .order.failed .st { background: #3a1618; color: #ff9a9a; }
  .order.cancelled .st { background: #241d26; color: #9c8c96; }
  button { margin-top: 10px; margin-right: 8px; padding: 10px 14px; border: 0; border-radius: 10px; background: #3f9d4a; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid #4a3450; color: #cbb8c3; font-weight: 400; }
  button:disabled { opacity: 0.5; }
  .err { color: #ff9a9a; font-size: 12px; margin-top: 8px; word-break: break-all; }
  .empty { color: #8f7d88; text-align: center; padding: 30px 0; }
  .note { max-width: 640px; margin: 0 auto; padding: 0 18px; color: #8f7d88; font-size: 11.5px; }
  .auto { max-width: 640px; margin: 12px auto 0; padding: 11px 14px; border-radius: 12px; border: 1px solid #3a2740; background: #1d1222; font-size: 12.5px; line-height: 1.8; color: #cbb8c3; }
  .auto b { color: #ffcf8a; }
  .auto code { color: #8ee0a6; word-break: break-all; font-size: 11.5px; }
</style>
</head>
<body>
<header>
  <h1>订单 · 关系复原胶</h1>
  <p class="sub">确认到账之后，服务器才会调模型生成（480P · 30 秒 · 9.9 元/支）</p>
</header>
<p class="note">这页只有拿到口令的人能打开。刷新即最新；每 5 秒自动刷新。</p>
<div class="auto" id="autoBox">正在读配置…</div>
<div id="list"><p class="empty">正在读订单…</p></div>
<script>
(function () {
  const key = new URLSearchParams(location.search).get('key') || '';
  const list = document.getElementById('list');
  const label = (s) => ({ awaiting: '待付款', review: '已付款 · 待确认', paid: '已付款 · 待生成', generating: '生成中', done: '已完成', failed: '生成失败', cancelled: '已取消' }[s] || s);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let busy = false;

  async function act(id, what, btn) {
    if (busy) return;
    busy = true;
    if (btn) { btn.disabled = true; btn.textContent = '处理中…'; }
    try {
      const r = await fetch('/api/admin/orders/' + id + '/' + what + '?key=' + encodeURIComponent(key), { method: 'POST' });
      const b = await r.json().catch(() => ({}));
      if (!r.ok) alert(b.error || '没成功');
    } catch (e) { alert('网络不太好，再试一次'); }
    busy = false;
    load();
  }

  function render(orders) {
    if (!orders.length) { list.innerHTML = '<p class="empty">还没有订单</p>'; return; }
    list.innerHTML = orders.map((o) => {
      const waiting = o.status === 'review' || o.status === 'failed' || o.status === 'awaiting';
      const action = o.status === 'failed' ? '重试生成' : (o.status === 'awaiting' ? '手动放行并生成' : '确认到账并生成');
      return '<div class="order ' + esc(o.status) + '">'
        + '<div class="row"><b>' + esc(o.names.me) + ' · ' + esc(o.names.partner) + '</b><span class="price">¥' + esc(o.amount) + '</span></div>'
        + '<div class="meta">订单 ' + esc(o.id) + ' · 房间 ' + esc(o.roomId) + ' · ' + esc(new Date(o.at).toLocaleString()) + '</div>'
        + '<div class="st">' + esc(label(o.status)) + '</div>'
        + (waiting ? '<button data-act="confirm" data-id="' + esc(o.id) + '">' + action + '</button>' : '')
        + (o.status === 'review' || o.status === 'awaiting' ? '<button class="ghost" data-act="cancel" data-id="' + esc(o.id) + '">没收到，取消</button>' : '')
        + (o.error ? '<div class="err">' + esc(o.error) + '</div>' : '')
        + '</div>';
    }).join('');
  }

  async function loadState() {
    const box = document.getElementById('autoBox');
    try {
      const r = await fetch('/api/admin/state?key=' + encodeURIComponent(key));
      const b = await r.json().catch(() => ({}));
      if (!r.ok) { box.innerHTML = '口令不对：' + esc(b.error || ''); return; }
      if (b.auto) {
        box.innerHTML = '<b>自动放行：已开启</b><br>把收款服务（商户号或免签服务）的回调地址填成：<br>'
          + '<code>' + esc(location.origin + b.notifyUrl) + '</code><br>'
          + '<span style="color:#8f7d88">回调里带回 out_trade_no 和 amount，服务器核对金额后自动生成，不用你点。</span>'
          + '<br><b>微信提醒：' + (b.push ? '已开启' : '未配置') + '</b>'
          + (b.push ? '<span style="color:#8f7d88">（有人点「已付款」，你的微信会收到一条，点链接即放行）</span>' : '');
      } else {
        box.innerHTML = '<b>自动放行：未配置</b> —— 现在只能手动确认；接上收款服务的回调后自动生效。<br>'
          + '<b>微信提醒：' + (b.push ? '已开启' : '未配置') + '</b>';
      }
    } catch (e) { box.textContent = '读不到配置'; }
  }

  async function load() {
    try {
      const r = await fetch('/api/admin/orders?key=' + encodeURIComponent(key));
      const b = await r.json().catch(() => ({}));
      if (!r.ok) { list.innerHTML = '<p class="err">' + esc(b.error || '打不开') + '</p>'; return; }
      render(b.orders || []);
    } catch (e) { list.innerHTML = '<p class="err">连不上服务</p>'; }
  }

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (btn) act(btn.dataset.id, btn.dataset.act, btn);
  });

  load();
  loadState();
  setInterval(load, 5000);
  setInterval(loadState, 30000);
})();
</script>
</body>
</html>
